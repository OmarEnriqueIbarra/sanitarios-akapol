<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baños · Akapol</title>
<style>
  :root{--az:#0b3d91;--az2:#e8eef9;--rojo:#c62828;--rojo2:#fdecea;--amar:#8a6d00;--amar2:#fff6d6;--gris:#666;--borde:#d6dbe4}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f5f9;color:#222}
  header{background:var(--az);color:#fff;padding:16px;text-align:center}
  header h1{margin:0;font-size:1.2rem}
  header p{margin:4px 0 0;font-size:.85rem;opacity:.85}
  main{max-width:520px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:1rem;color:var(--az)}
  label{display:block;font-size:.85rem;color:var(--gris);margin:8px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--borde);border-radius:8px;font-size:1rem;font-family:inherit}
  textarea{min-height:70px;resize:vertical}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;padding:12px 6px;border:2px solid var(--az);background:#fff;color:var(--az);border-radius:10px;font-weight:600;font-size:.95rem;cursor:pointer}
  .tab.on{background:var(--az);color:#fff}
  .tab.rep{border-color:var(--rojo);color:var(--rojo)}
  .tab.rep.on{background:var(--rojo);color:#fff}
  .opciones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .op{padding:12px 8px;border:2px solid var(--borde);border-radius:10px;background:#fff;font-size:.9rem;cursor:pointer;text-align:center}
  .op.on{border-color:var(--az);background:var(--az2);color:var(--az);font-weight:600}
  #bloqueRep .op.on{border-color:var(--rojo);background:var(--rojo2);color:var(--rojo)}
  .urg{display:flex;gap:8px;margin-top:4px}
  .urg .op{flex:1}
  .btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer}
  .enviar{background:var(--az);color:#fff}
  .wa{background:#25d366;color:#fff;margin-top:10px}
  .sec{background:#fff;color:var(--az);border:2px solid var(--az);margin-top:10px}
  .btn:disabled{background:#b7c2b9;color:#fff;cursor:not-allowed}
  .aviso{font-size:.8rem;color:var(--gris);text-align:center;margin-top:8px}
  .msg{border-radius:10px;padding:12px;margin-bottom:10px;font-size:.95rem;line-height:1.4}
  .msg.ok{background:#e8f5e9;color:#2e7d32}
  .msg.rep{background:var(--amar2);color:var(--amar)}
  .msg.err{background:var(--rojo2);color:var(--rojo)}
  .persona{margin-top:10px;padding:10px;border-radius:8px;font-size:.95rem}
  .persona.ok{background:var(--az2);color:var(--az)}
  .persona.no{background:var(--rojo2);color:var(--rojo)}
  .foto{display:block;text-align:center;padding:12px;border:2px dashed var(--borde);border-radius:10px;color:var(--az);font-weight:600;cursor:pointer;margin:0}
  #fotoPrev img{width:100%;max-height:240px;object-fit:contain;border-radius:8px;margin-top:8px;background:#eee}
  .quitar{margin-top:6px;border:0;background:none;color:var(--rojo);font-size:.9rem;cursor:pointer}
  .oculto{display:none}
</style>
</head>
<body>
<header>
  <h1>🧻 Baños de planta</h1>
  <p>Pedido de elementos de higiene · Aviso de problemas</p>
</header>

<main>
 <div id="form">
  <div class="card">
    <h2>1. Tus datos</h2>
    <label for="legajo">Número de legajo</label>
    <input id="legajo" placeholder="Ej: 1604" autocomplete="off" autocapitalize="off">
    <div id="persona" class="persona oculto"></div>
  </div>

  <div class="card">
    <h2>2. ¿Qué baño?</h2>
    <select id="bano"></select>
  </div>

  <div class="card" id="bloquePedido">
    <h2>3. 🧴 ¿Falta algo?</h2>
    <div class="opciones" id="listaInsumos"></div>
    <label for="obsPedido">Observaciones (opcional)</label>
    <textarea id="obsPedido"></textarea>
  </div>

  <div class="card" id="bloqueRep">
    <h2>4. ⚠️ ¿Hay algún problema?</h2>
    <div class="opciones" id="listaProblemas"></div>
   <div id="extraRep" class="oculto">
    <label>¿Qué tan urgente?</label>
    <div class="urg">
      <button class="op" data-u="Normal" onclick="urgencia(this)">Normal</button>
      <button class="op" data-u="URGENTE" onclick="urgencia(this)">🚨 Urgente</button>
    </div>
    <label for="detalle">Detalle (dónde, qué se ve)</label>
    <textarea id="detalle" placeholder="Ej: pierde agua la canilla del lavatorio del medio"></textarea>
    <label>Foto (opcional)</label>
    <label class="foto" for="foto">📷 Sacar o elegir foto</label>
    <input id="foto" type="file" accept="image/*" capture="environment" class="oculto">
    <div id="fotoPrev" class="oculto"><img id="fotoImg" alt=""><button type="button" class="quitar" onclick="quitarFoto()">✕ Quitar foto</button></div>
   </div>
  </div>
  <p class="aviso" style="margin-top:-6px;margin-bottom:12px">Podés marcar faltantes, problemas o las dos cosas.</p>

  <button class="btn enviar" id="btnEnviar" onclick="enviar()" disabled>Enviar</button>
 </div>

 <div id="resultado" class="oculto">
  <div id="mensajes"></div>
  <button class="btn wa oculto" id="btnWa">Enviar aviso por WhatsApp</button>
  <button class="btn sec" onclick="location.reload()">Hacer otro pedido</button>
  <p class="aviso" id="avisoWa"></p>
 </div>
</main>

var insSel={}, probSel={}, urg='', persona=null, fotoData='';

// Foto: se achica a 1280px y se comprime antes de enviar
$('foto').addEventListener('change',function(){
  var f=this.files[0]; if(!f) return;
  var img=new Image(), url=URL.createObjectURL(f);
  img.onload=function(){
    var k=Math.min(1,1280/Math.max(img.width,img.height));
    var c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    fotoData=c.toDataURL('image/jpeg',0.7);
    $('fotoImg').src=fotoData; $('fotoPrev').classList.remove('oculto');
    URL.revokeObjectURL(url);
  };
  img.src=url;
});
function quitarFoto(){ fotoData=''; $('foto').value=''; $('fotoPrev').classList.add('oculto'); }
function $(id){return document.getElementById(id)}

$('bano').innerHTML='<option value="">— Elegí el baño —</option>'+BANOS.map(function(b){return '<option>'+b+'</option>'}).join('');
$('listaInsumos').innerHTML=INSUMOS.map(function(n,i){return '<button class="op" id="i'+i+'" onclick="marcar(insSel,\'i\','+i+')">'+n+'</button>'}).join('');
$('listaProblemas').innerHTML=PROBLEMAS.map(function(p,i){return '<button class="op" id="p'+i+'" onclick="marcar(probSel,\'p\','+i+')">'+p+'</button>'}).join('');

function marcar(obj,pref,i){
  obj[i]=!obj[i]; $(pref+i).classList.toggle('on',obj[i]);
  $('extraRep').classList.toggle('oculto',!elegidos(PROBLEMAS,probSel).length);
  validar();
}
function urgencia(el){
  document.querySelectorAll('.urg .op').forEach(function(b){b.classList.remove('on')});
  el.classList.add('on'); urg=el.dataset.u; validar();
}
function elegidos(lista,sel){ return lista.filter(function(_,i){return sel[i]}); }

function validar(){
  var ok=persona && $('bano').value;
  var ni=elegidos(INSUMOS,insSel).length, np=elegidos(PROBLEMAS,probSel).length;
  ok=ok && (ni||np) && (!np||urg);
  $('btnEnviar').disabled=!ok;
}
$('bano').addEventListener('change',validar);
$('legajo').addEventListener('input',function(){
  var t=this.value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  var v=t.replace(/\D/g,''), box=$('persona');
  persona=null;
  if(t.length>=4 && 'porteria'.indexOf(t)===0){
    persona=['PORTERIA','Portería','Portería'];
    box.className='persona ok'; box.innerHTML='<b>Portería</b>';
  } else if(/^[a-z]/.test(t) && !/^zz\d/.test(t)){
    box.className='persona no'; box.innerHTML='Legajo no encontrado';
  } else if(v.length>=3){
    var leg='ZZ'+('00000'+v).slice(-5);
    persona=PERSONAL.filter(function(p){return p[0]===leg})[0]||null;
    box.className='persona '+(persona?'ok':'no');
    box.innerHTML=persona?'<b>'+esc(persona[1])+'</b><br>'+esc(persona[2]):'Legajo no encontrado';
  } else box.className='persona oculto';
  validar();
});

function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]}); }
function dos(n){return (n<10?'0':'')+n}

function enviar(){
  var ins=elegidos(INSUMOS,insSel), prob=elegidos(PROBLEMAS,probSel);
  var datos={
    bano: $('bano').value,
    items: ins.map(function(i){return {i:i,t:'Pedido'}}).concat(prob.map(function(i){return {i:i,t:'Problema'}})),
    urgencia: prob.length?urg:'',
    nombre: persona[0]==='PORTERIA'?'Portería':persona[1]+' ('+persona[0]+')',
    sector: persona[2],
    obs: $('obsPedido').value.trim(),
    detalle: prob.length?$('detalle').value.trim():'',
    foto: prob.length?fotoData:''
  };
  var b=$('btnEnviar'); b.disabled=true; b.textContent='Enviando…';

  fetch(URL_SCRIPT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(datos)})
    .then(function(r){return r.json()})
    .then(function(res){
      if(!res.ok) throw new Error(res.error);
      datos.fotoUrl=res.fotoUrl||'';
      mostrar(datos,res);
    })
    .catch(function(){
      b.disabled=false; b.textContent='Enviar';
      alert('No se pudo enviar. Revisá la conexión e intentá de nuevo.');
    });
}

function mostrar(datos,res){
  var h='';
  if(res.repetidos.length){
    h+='<div class="msg rep"><b>⚠️ Ya fue pedido y está pendiente:</b><br>'+
      res.repetidos.map(function(r){return '• '+esc(r.item)+' — '+esc(r.hora)+' ('+esc(r.nombre)+')'}).join('<br>')+
      '<br>No hace falta volver a pedirlo.</div>';
  }
  if(res.nuevos.length){
    h+='<div class="msg ok"><b>✅ Registrado:</b><br>'+res.nuevos.map(function(n){return '• '+esc(n)}).join('<br>')+'</div>';
    $('btnWa').classList.remove('oculto');
    $('btnWa').onclick=function(){ abrirWa(datos,res.nuevos); };
    if(!res.repetidos.length){ $('avisoWa').textContent='Abriendo WhatsApp…'; setTimeout(function(){ abrirWa(datos,res.nuevos); },600); }
    else $('avisoWa').textContent='Tocá el botón verde para enviar el aviso de lo nuevo.';
  }
  $('mensajes').innerHTML=h;
  $('form').classList.add('oculto');
  $('resultado').classList.remove('oculto');
  window.scrollTo(0,0);
}

function abrirWa(datos,nuevos){
  var d=new Date(), L=[];
  var falta=[], prob=[];
  datos.items.forEach(function(x){ if(nuevos.indexOf(x.i)>=0) (x.t==='Pedido'?falta:prob).push(x.i); });
  L.push((prob.length&&datos.urgencia==='URGENTE'?'🚨 ':'')+'*BAÑOS · AKAPOL*');
  L.push('Fecha: '+dos(d.getDate())+'/'+dos(d.getMonth()+1)+'/'+d.getFullYear()+' '+dos(d.getHours())+':'+dos(d.getMinutes()));
  L.push('Nombre: '+datos.nombre);
  L.push('Sector: '+datos.sector);
  L.push('Baño: '+datos.bano);
  if(falta.length){
    L.push(''); L.push('*🧴 Falta:*');
    falta.forEach(function(n){L.push('- '+n)});
    if(datos.obs) L.push('Obs: '+datos.obs);
  }
  if(prob.length){
    L.push(''); L.push('*⚠️ Problema ('+datos.urgencia+'):*');
    prob.forEach(function(n){L.push('- '+n)});
    if(datos.detalle) L.push('Detalle: '+datos.detalle);
    if(datos.fotoUrl) L.push('Foto: '+datos.fotoUrl);
  }
  location.href='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(L.join('\n'));
}
